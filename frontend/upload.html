<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Document - AI Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="nav-bar">
    <h1>✨ AI Chatbot</h1>
    <div class="nav-links">
      <span class="nav-link" onclick="location.href='chat.html'">💬 Chat</span>
      <span class="nav-link" onclick="location.href='documents.html'">📁 Documents</span>
      <span class="nav-link" onclick="logout()">🚪 Logout</span>
    </div>
  </div>

  <div class="page-header">
    <h2>📤 Upload Document</h2>
  </div>

  <div class="upload-card">
    <p class="info-text">📄 Upload PDF or text documents to chat with them</p>
    
    <div class="form-group">
      <label>🗂️ Select File</label>
      <input id="file" type="file" accept=".pdf,.txt" required>
    </div>

    <button class="btn-primary" onclick="uploadDocument()">🚀 Upload Document</button>
  </div>

  <div class="footer-links">
    <span class="link" onclick="location.href='documents.html'">📁 View My Documents</span>
    <span class="link" onclick="location.href='chat.html'">💬 Back to Chat</span>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
