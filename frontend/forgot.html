<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - AI Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="auth-card">
    <h2>Forgot Password</h2>
    <p class="info-text">Enter your email to receive a password reset OTP</p>

    <div class="form-group">
      <label>Email</label>
      <input id="email" type="email" placeholder="Enter your email" required>
    </div>

    <button class="btn-primary" onclick="forgotPasswordStep1()">Send OTP</button>

    <hr class="divider">
    <p class="link-text"><span class="link" onclick="location.href='index.html'">Back to Login</span></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
