<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - AI Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="auth-card">
    <h1>✨ AI Chatbot</h1>
    <h2>Create Account</h2>

    <div class="form-group">
      <label>👤 Full Name</label>
      <input id="name" type="text" placeholder="Enter your name" required>
    </div>

    <div class="form-group">
      <label>📧 Email</label>
      <input id="email" type="email" placeholder="Enter your email" required>
    </div>

    <div class="form-group">
      <label>🔐 Password</label>
      <input id="password" type="password" placeholder="At least 6 characters" required>
    </div>

    <button class="btn-primary" onclick="registerStep1()">🚀 Send OTP</button>

    <hr class="divider">
    <p class="link-text">Already have an account? <span class="link" onclick="location.href='index.html'">🔓 Login here</span></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
