<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AI Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="auth-card">
    <div class="auth-header">
      <span class="back-link" onclick="location.href='index.html'">← Back</span>
    </div>
    
    <h1>✨ AI Chatbot</h1>
    <h2>Welcome Back</h2>

    <div class="form-group">
      <label>📧 Email</label>
      <input id="email" type="email" placeholder="Enter your email" required>
    </div>

    <div class="form-group">
      <label>🔐 Password</label>
      <input id="password" type="password" placeholder="Enter your password" required>
    </div>

    <button class="btn-primary" onclick="loginStep1()">🚀 Send OTP</button>

    <hr class="divider">
    <p class="link-text">Don't have an account? <span class="link" onclick="location.href='register.html'">📝 Register here</span></p>
    <p class="link-text"><span class="link" onclick="location.href='forgot.html'">🔑 Forgot Password?</span></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
