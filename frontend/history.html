<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat History - AI Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="nav-bar">
    <h1>✨ AI Chatbot</h1>
    <div class="nav-links">
      <span class="nav-link" onclick="location.href='chat.html'">💬 Chat</span>
      <span class="nav-link" onclick="location.href='documents.html'">📁 Documents</span>
      <span class="nav-link" onclick="location.href='profile.html'">👤 Profile</span>
      <span class="nav-link" onclick="logout()">🚪 Logout</span>
    </div>
  </div>

  <div class="page-header">
    <h2>📋 Chat History</h2>
    <div class="history-actions">
      <button class="btn-secondary" onclick="searchHistory()">🔍 Search</button>
      <button class="btn-secondary" onclick="exportChatHistory()">📥 Export</button>
      <button class="btn-delete" onclick="deleteHistory()">🗑️ Delete All</button>
    </div>
  </div>

  <div class="history-box" id="history"></div>

  <div class="footer-links">
    <span class="link" onclick="location.href='chat.html'">💬 Back to Chat</span>
  </div>
</div>

<script src="app.js"></script>
<script>
  loadChatHistory();
</script>
</body>
</html>
